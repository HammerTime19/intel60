name: Update Intel60

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # "Run workflow" button in the Actions tab, or the external timer
    inputs:
      source:
        description: "Set to 'timer' by the external 30-minute trigger"
        required: false
        default: manual
      test_teams:
        description: "Send a test card to the Teams chat only"
        type: boolean
        default: false
      test_teams_story:
        description: "Send the newest critical story to the Teams chat (preview)"
        type: boolean
        default: false
      test_push:
        description: "Send a test web push notification (only while there are 2 or fewer subscribers)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read     # lets the health job see whether the previous run failed
  deployments: read # lets a run see whether the last site deploy failed

concurrency:
  group: intel60
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      redeploy: ${{ steps.lastdeploy.outputs.redeploy }}
      push_ids: ${{ steps.brief.outputs.push_ids }}
      push_digest_since: ${{ steps.brief.outputs.push_digest_since }}
      push_trending: ${{ steps.brief.outputs.push_trending }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main   # latest cards, even if this run waited in the queue behind another one

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch and summarize news
        id: brief
        run: python pipeline/brief.py
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
          TEST_TEAMS: ${{ inputs.test_teams }}
          TEST_TEAMS_STORY: ${{ inputs.test_teams_story }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          APP_URL: ${{ vars.APP_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Build story and CVE pages
        run: python pipeline/pages.py

      - name: Commit new cards
        id: commit
        run: |
          git config user.name "intel60-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cards.json docs/deadlines.json pipeline/state.json pipeline/archive.json
          git add docs/story docs/cve docs/sitemap.xml docs/robots.txt
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update cards"
            # GitHub sometimes rejects a push with a brief server error, so try up to 3 times
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break   # on a clash, keep this run's newer cards
              [ "$i" = 3 ] && exit 1
              echo "push failed, retrying in $((i * 20))s"; sleep $((i * 20))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the last site deploy
        id: lastdeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # if the last deploy failed (usually a GitHub Pages outage), deploy again even without new stories
          url=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].statuses_url // ""' || true)
          state=$([ -n "$url" ] && gh api "$url" --jq '.[0].state // ""' || true)
          echo "last deploy: ${state:-unknown}"
          if [ "$state" = failure ] || [ "$state" = error ]; then echo "redeploy=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        if: steps.commit.outputs.changed == 'true' || steps.lastdeploy.outputs.redeploy == 'true' || (github.event_name != 'schedule' && inputs.source != 'timer')
        with:
          path: docs

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || needs.update.outputs.redeploy == 'true' || (github.event_name != 'schedule' && inputs.source != 'timer')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  notify:
    # Web push alerts, sent after the deploy so a tapped notification opens a story that's already live
    needs: [update, deploy]
    if: always() && needs.update.result == 'success' && (needs.update.outputs.push_ids != '' || needs.update.outputs.push_trending != '' || needs.update.outputs.push_digest_since != '' || inputs.test_push)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main   # includes the cards this run just committed

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - run: pip install pywebpush==2.4.0 requests==2.34.2

      - name: Send alerts
        run: python pipeline/push.py
        env:
          PUSH_IDS: ${{ needs.update.outputs.push_ids }}
          PUSH_DIGEST_SINCE: ${{ needs.update.outputs.push_digest_since }}
          PUSH_TRENDING: ${{ needs.update.outputs.push_trending }}
          PUSH_TEST: ${{ inputs.test_push }}
          PUSH_API: ${{ vars.PUSH_API }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

  health:
    # Alerts the owner (NTFY_ADMIN_TOPIC) when two runs in a row fail, and again when runs recover.
    # One failure on its own is usually a GitHub blip that the next run fixes, so it doesn't alert.
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report failures and recoveries
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
          FAILED: ${{ contains(fromJSON('["failure","cancelled"]'), needs.update.result) || contains(fromJSON('["failure","cancelled"]'), needs.deploy.result) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ADMIN_TOPIC" ]; then echo "NTFY_ADMIN_TOPIC not set"; exit 0; fi
          prevs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow update.yml --status completed -L 2 --json conclusion --jq '[.[].conclusion] | join(" ")')
          prev=${prevs%% *}; before=${prevs#* }
          echo "this run failed: $FAILED, previous runs: $prevs"
          if [ "$FAILED" = true ] && [ "$prev" = failure ] && [ "$before" != failure ]; then
            curl -s -H "Title: Intel60: updates failing" -H "Priority: 4" -H "Tags: rotating_light" -H "Click: $RUN_URL"               -d "Two runs in a row failed (update: ${{ needs.update.result }}, deploy: ${{ needs.deploy.result }}). Check githubstatus.com, then tap to open the log. You will get another alert when it recovers."               "https://ntfy.sh/$ADMIN_TOPIC"
          elif [ "$FAILED" != true ] && [ "$prev" = failure ] && [ "$before" = failure ]; then
            curl -s -H "Title: Intel60: updates recovered" -H "Tags: white_check_mark" -H "Click: $RUN_URL"               -d "Runs are succeeding again." "https://ntfy.sh/$ADMIN_TOPIC"
          fi
